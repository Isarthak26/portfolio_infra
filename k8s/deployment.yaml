apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app: portfolio
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio

  # Zero-downtime rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # Allow 1 extra pod during update
      maxUnavailable: 0   # Never take a pod down before new one is ready

  template:
    metadata:
      labels:
        app: portfolio
    spec:
      # ─────────────────────────────────────────
      # Security: run as non-root user
      # ─────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: portfolio
          # ⚠️  IMPORTANT: Replace 'portfolioacr' with YOUR ACR registry name
          # Jenkins will auto-update this image tag on every successful build
          image: portfolioacr112.azurecr.io/portfolio:10

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # ─────────────────────────────────────
          # Security hardening
          # ─────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # serve needs to write temp files
            capabilities:
              drop:
                - ALL

          # ─────────────────────────────────────
          # Resource limits (cost control + stability)
          # ─────────────────────────────────────
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # ─────────────────────────────────────
          # Health checks
          # ─────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3

          # ─────────────────────────────────────
          # Environment variables
          # ─────────────────────────────────────
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

      # Graceful shutdown
      terminationGracePeriodSeconds: 30
